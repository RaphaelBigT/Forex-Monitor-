name: Backtest

on:
  workflow_dispatch:
    inputs:
      timeframe:
        description: "Candle size to test"
        type: choice
        options:
          - 4h
          - 1h
          - 1day
        default: 4h

permissions:
  contents: write

concurrency:
  group: forex-backtest
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run the backtest
        env:
          TWELVE_DATA_KEY: ${{ secrets.TWELVE_DATA_KEY }}
          BT_TIMEFRAME: ${{ inputs.timeframe }}
        run: node backtest.js

      - name: Save the report
        if: always()
        run: |
          if [ -n "$(git status --porcelain backtest)" ]; then
            git config user.name "forex-monitor"
            git config user.email "forex-monitor@users.noreply.github.com"
            git add backtest
            git commit -m "Add backtest report"
            git pull --rebase --autostash
            git push
          fi
