name: Forex stochastic monitor

on:
  schedule:
    - cron: "3,18,33,48 * * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Send a test notification to my phone"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: forex-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check the market
        env:
          TWELVE_DATA_KEY: ${{ secrets.TWELVE_DATA_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: node monitor.js ${{ github.event_name == 'workflow_dispatch' && inputs.test && '--test' || '' }}

      - name: Save state
        if: always()
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "forex-monitor"
            git config user.email "forex-monitor@users.noreply.github.com"
            git add state.json
            git commit -m "Update monitor state"
            git pull --rebase --autostash
            git push
          fi
